<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Search Movies &amp; Series - Nikflix</title>
  <meta name="description" content="Search Nikflix for movies, TV series and anime by title, genre or year. Find horror, romance, tragedy, sci-fi and more in seconds.">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <main id="main" class="container page">
    <h1 class="page-title">Search</h1>
    <p class="page-sub">Find movies, series and anime by title, genre or year.</p>

    <form class="search-box" id="search-form" role="search" action="search.html" method="get">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr-only" for="q">Search movies and series</label>
      <input id="q" name="q" type="search" placeholder="e.g. Naruto, horror, 2019..." autocomplete="off" autofocus>
      <button class="icon-btn clear-btn" type="button" id="clear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </form>

    <div class="chips" role="group" aria-label="Filter by type">
      <button class="chip" type="button" data-type="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-type="movie" aria-pressed="false">Movies</button>
      <button class="chip" type="button" data-type="series" aria-pressed="false">Series</button>
    </div>

    <div id="results" aria-live="polite"></div>
    <section class="section" id="live" hidden aria-labelledby="live-title">
      <h2 id="live-title">More series from TVmaze</h2>
      <div id="live-body"></div>
    </section>
    <section class="section" id="live-ia" hidden aria-labelledby="live-ia-title">
      <h2 id="live-ia-title">Full-length streams from Internet Archive</h2>
      <div id="live-ia-body"></div>
    </section>
    <noscript><div class="notice error">Please enable JavaScript to search Nikflix.</div></noscript>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    const { $, $$, esc, CATALOG, CATEGORIES, search, gridHTML, emptyHTML, noticeHTML, debounce, params, cardHTML } = SF;
    const input = $("#q"), clear = $("#clear"), results = $("#results");
    const live = $("#live"), liveBody = $("#live-body");
    const liveIa = $("#live-ia"), liveIaBody = $("#live-ia-body");
    let type = ["movie", "series"].includes(params().get("type")) ? params().get("type") : "all";
    input.value = params().get("q") || "";

    const knownTvmaze = new Set(CATALOG.filter((x) => x.tvmaze).map((x) => x.tvmaze));
    const knownIa = new Set(CATALOG.filter((x) => x.ia).map((x) => x.ia));
    let liveCtrl = null;

    const syncUrl = () => {
      const p = new URLSearchParams();
      if (input.value.trim()) p.set("q", input.value.trim());
      if (type !== "all") p.set("type", type);
      history.replaceState(null, "", "search.html" + (p.toString() ? "?" + p : ""));
    };

    function render() {
      const q = input.value.trim();
      clear.hidden = !q;
      $$(".chip[data-type]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.type === type)));

      if (!q) {
        const pool = type === "all" ? CATALOG : CATALOG.filter((x) => x.type === type);
        results.innerHTML = `
          <h2 class="row-title" style="margin-bottom:10px">Popular genres</h2>
          <div class="chips">${CATEGORIES.map((c) => `<button class="chip" type="button" data-suggest="${esc(c.name)}">${esc(c.name)}</button>`).join("")}</div>
          <h2 class="row-title" style="margin:18px 0 10px">Top picks for you</h2>
          ${gridHTML(pool.slice(0, 24))}`;
        live.hidden = true;
        liveIa.hidden = true;
        return;
      }

      const found = search(q, type);
      results.innerHTML = found.length
        ? `<p class="result-count">${found.length} result${found.length === 1 ? "" : "s"} for "${esc(q)}"</p>${gridHTML(found)}`
        : emptyHTML(`No results for "${q}"`, "Try a different title, a genre like <b>anime</b> or <b>horror</b>, or a year like <b>2019</b>.");
      liveSearch(q);
    }

    // Extra live results for series (TVmaze) and full-length movies/anime (Internet Archive).
    const liveSearch = debounce(async (q) => {
      if (q.length < 2) { live.hidden = true; liveIa.hidden = true; return; }
      liveCtrl?.abort();
      liveCtrl = new AbortController();

      if (type !== "movie") {
        live.hidden = false;
        liveBody.innerHTML = '<div class="spinner" role="status" aria-label="Loading more results"></div>';
        fetch("https://api.tvmaze.com/search/shows?q=" + encodeURIComponent(q), { signal: liveCtrl.signal })
          .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
          .then((data) => {
            if (input.value.trim() !== q) return;
            const items = data.map((r) => r.show)
              .filter((s) => !knownTvmaze.has(s.id))
              .slice(0, 14)
              .map((s) => ({
                id: "tvmaze-" + s.id, tvmaze: s.id, tvmazeOnly: true, type: "series", title: s.name,
                year: s.premiered ? +s.premiered.slice(0, 4) : null, rating: s.rating?.average || null,
                poster: s.image?.medium ? s.image.medium.replace(/^http:/, "https:") : null, genres: [],
              }));
            liveBody.innerHTML = items.length ? gridHTML(items) : `<p class="result-count">No extra series found on TVmaze for "${esc(q)}".</p>`;
          })
          .catch((err) => {
            if (err.name === "AbortError") return;
            liveBody.innerHTML = noticeHTML("error", "Couldn't load extra results from TVmaze.");
          });
      } else {
        live.hidden = true;
      }

      liveIa.hidden = false;
      liveIaBody.innerHTML = '<div class="spinner" role="status" aria-label="Loading Archive streams"></div>';
      const iaQuery = `title:(${q.replace(/["():]/g, " ")}) AND mediatype:movies`;
      const iaUrl = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(iaQuery)}&fl[]=identifier,title,year&sort[]=downloads+desc&rows=12&output=json`;
      fetch(iaUrl, { signal: liveCtrl.signal })
        .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
        .then((data) => {
          if (input.value.trim() !== q) return;
          const docs = (data.response?.docs || []).filter((d) => !knownIa.has(d.identifier));
          const items = docs.map((d) => ({
            id: "ia-" + d.identifier,
            ia: d.identifier,
            iaOnly: true,
            type: "movie",
            title: Array.isArray(d.title) ? d.title[0] : (d.title || d.identifier),
            year: d.year ? parseInt(String(d.year).slice(0, 4), 10) : null,
            rating: null,
            poster: `https://archive.org/services/img/${encodeURIComponent(d.identifier)}`,
            genres: [],
          }));
          liveIaBody.innerHTML = items.length ? gridHTML(items) : `<p class="result-count">No full-length streams found on Internet Archive for "${esc(q)}".</p>`;
        })
        .catch((err) => {
          if (err.name === "AbortError") return;
          liveIaBody.innerHTML = noticeHTML("error", "Couldn't load streams from Internet Archive.");
        });
    }, 450);

    input.addEventListener("input", debounce(() => { syncUrl(); render(); }, 150));
    $("#search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!input.value.trim()) return; // app.js already shows the error message
      syncUrl(); render(); input.blur();
    });
    clear.addEventListener("click", () => { input.value = ""; syncUrl(); render(); input.focus(); });
    document.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip[data-type]");
      if (chip) { type = chip.dataset.type; syncUrl(); render(); }
      const sug = e.target.closest("[data-suggest]");
      if (sug) { input.value = sug.dataset.suggest; syncUrl(); render(); }
    });
    render();
  })();
  </script>
</body>
</html>
