<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://api.tvmaze.com https://v3-cinemeta.strem.io https://api.github.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>
    if (location.protocol !== "file:") {
      const seg = location.pathname.split("/")[1] || "";
      const b = location.hostname.endsWith(".github.io") && /^[a-zA-Z0-9._-]+$/.test(seg) ? "/" + seg + "/" : "/";
      const base = document.createElement("base");
      base.setAttribute("href", b);
      document.head.appendChild(base);
    }
  </script>
  <title>Page Not Found (404) - Nikflix</title>
  <meta name="description" content="Sorry, the page you were looking for doesn't exist on Nikflix. Head back home or search for a movie or series.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=20261121">
</head>
<body data-page="404">
  <main id="main" class="not-found">
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Lost your way?</h1>
      <p>Sorry, we can't find that page. You'll find plenty to watch on the home page.</p>
      <div class="hero-actions">
        <a class="btn btn-red" href="index.html">Nikflix Home</a>
        <a class="btn btn-ghost" href="search.html">Search titles</a>
      </div>
    </div>
  </main>

  <script src="js/data.js?v=20261121"></script>
  <script src="js/app.js?v=20261121"></script>
</body>
</html>
