<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>if (location.protocol !== "file:") { const b = location.hostname.endsWith(".github.io") && location.pathname.split("/").length > 2 ? "/" + location.pathname.split("/")[1] + "/" : "/"; document.write('<base href="' + b + '">'); }</script>
  <title>Page Not Found (404) - Nikflix</title>
  <meta name="description" content="Sorry, the page you were looking for doesn't exist on Nikflix. Head back home or search for a movie or series.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="404">
  <main id="main" class="not-found">
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Lost your way?</h1>
      <p>Sorry, we can't find that page. You'll find plenty to watch on the home page.</p>
      <div class="hero-actions">
        <a class="btn btn-red" href="index.html">Nikflix Home</a>
        <a class="btn btn-ghost" href="search.html">Search titles</a>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
